operator: bandpass_filter
version: 1
parameters:
  l_freq:
    research_trigger: paradigm_dependent
    canonical_question: |
      What is the recommended high-pass cutoff (l_freq) for {paradigm}
      {modality} preprocessing?
    empirical_defaults:
      motor_imagery:  {value: 8.0,  unit: Hz, origin: "Pfurtscheller 1999, motor_imagery skill"}
      p300_erp:       {value: 0.1,  unit: Hz, origin: "Luck 2014, p300_erp skill"}
      ssvep:          {value: 5.0,  unit: Hz, origin: "ssvep skill"}
      sleep_staging:  {value: 0.3,  unit: Hz, origin: "AASM 2007, sleep_staging skill"}
      seeg_epilepsy:  {value: 1.0,  unit: Hz, origin: "seeg_epilepsy skill"}
      eeg:            {value: 1.0,  unit: Hz, origin: "eeg_general skill"}
      _default:       {value: 1.0,  unit: Hz, origin: "eeg_general skill"}
    sanity_range: [0.01, 50.0]

  h_freq:
    research_trigger: paradigm_dependent
    canonical_question: |
      Recommended low-pass cutoff (h_freq) for {paradigm} {modality}?
    empirical_defaults:
      motor_imagery:  {value: 30.0, unit: Hz, origin: "Pfurtscheller 1999"}
      p300_erp:       {value: 30.0, unit: Hz, origin: "Luck 2014"}
      ssvep:          {value: 50.0, unit: Hz, origin: "ssvep skill"}
      sleep_staging:  {value: 35.0, unit: Hz, origin: "AASM 2007"}
      seeg_epilepsy:  {value: 70.0, unit: Hz, origin: "seeg_epilepsy skill"}
      eeg:            {value: 40.0, unit: Hz, origin: "eeg_general skill"}
      _default:       {value: 40.0, unit: Hz, origin: "eeg_general skill"}
    sanity_range: [1.0, 500.0]

  filter_order:
    research_trigger: never
    canonical_question: ""
    empirical_defaults:
      _default: {value: 4, origin: "Butterworth zero-phase, MNE convention"}

  method:
    research_trigger: never
    canonical_question: ""
    empirical_defaults:
      _default: {value: "iir", origin: "MNE convention"}
