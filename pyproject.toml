[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easybcidata-agent"
version = "0.1"
description = "LLM-powered BCI data processing agent — preprocess neural data with natural language"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "EasyBCIdata Team" }]
license = { text = "MIT" }
dependencies = [
  # Core — every direct dep is exact-pinned to ==X.Y.Z (no ranges).
  # Rationale: ranges allow PyPI to ship a fresh version of a transitive
  # at any time without a code review on our side. Exact pins mean the
  # only way a new package version reaches a user is via an intentional
  # update on our end (bump the pin in this file, regenerate uv.lock).
  # This was tightened on 2026-05-12 in response to the Mini Shai-Hulud
  # worm hitting mistralai 2.4.6 on PyPI; if that release had been
  # captured by `mistralai>=2.3.0,<3` rather than an exact pin, every
  # install in the hours before the quarantine would have pulled it.
  #
  # When updating: bump the version below AND regenerate uv.lock with
  # `uv lock` so the transitive resolution stays consistent. Don't
  # introduce ranges back without a written justification.
  #
  # Scope rule: only packages used by EVERY easybci session belong here.
  # Anything that's provider-specific (e.g. `anthropic`, `exa-py`,
  # `fal-client`) belongs in an extra and gets lazy-installed via
  # `tools/lazy_deps.py` when the user picks that backend. Smaller
  # `dependencies` = smaller blast radius for the next supply-chain attack.
  "openai==2.43.0",
  "python-dotenv==1.2.2",
  "fire==0.7.1",
  "httpx[socks]==0.28.1",
  "rich==14.3.4",
  "tenacity==9.1.4",
  "pyyaml==6.0.3",
  "ruamel.yaml==0.18.17",
  "requests==2.34.2",  # CVE-2026-25645
  "jinja2==3.1.6",
  "pydantic==2.13.4",
  # Interactive CLI (prompt_toolkit is used directly by cli.py)
  "prompt_toolkit==3.0.52",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]==2.13.0",  # CVE-2026-32597
  "psutil==7.2.2",
]

[project.optional-dependencies]
# Native Anthropic provider — only needed when provider=anthropic (not via
# OpenRouter or other aggregators).
anthropic = ["anthropic==0.111.0"]
# Web search backends — each only loaded when the user picks it as their
# search provider (configured via `easybci tools` or config.yaml).
# 2026-06: backend matrix trimmed to {exa, tavily}. firecrawl /
# parallel-web optional extras removed alongside their plugin packages.
exa = ["exa-py==2.14.0"]
# Image generation backends
fal = ["fal-client==0.14.1"]
# (Removed 2026-06: edge-tts / tts-premium / voice extras dropped along with
# the voice subsystem. Reinstate from git history if voice support returns.)
modal = ["modal==1.5.0"]
daytona = ["daytona==0.189.0"]
vercel = ["vercel==0.5.9"]
hindsight = ["hindsight-client==0.8.3"]
# BCI/Neural data processing — MNE + scientific Python stack.
# Only needed when using the neural toolset (inspect_neural, preprocess_neural, etc.)
neural = [
    "mne==1.12.1",
    "scikit-learn==1.9.0",
    "h5py==3.16.0",
    "scipy==1.18.0",
    "plotly==6.8.0",
    "mat73==0.65",
    "numpy==2.5.0",
    "pyedflib==0.1.42",
    "matplotlib==3.10.9",
    "pandas==2.3.3",
    "pyxdf==1.17.5",
    "pynwb==3.1.3",
    "hdmf==4.3.1",
    "curryreader==0.1.2",
]
# NWB (Neurodata Without Borders) output — kept as a standalone alias for
# downstream consumers (packagers, scripts) that pin `easybcidata-agent[nwb]`
# explicitly. The same pins are also listed in [neural] above so the default
# `setup-easybci.sh` (which installs `[all]` → `[neural]`) eager-installs
# them out of the box rather than waiting for the first NWB write to trigger
# the LAZY_DEPS["neural.pynwb"] path.
nwb = ["pynwb==3.1.3", "hdmf==4.3.1"]
dev = ["debugpy==1.8.21", "pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-xdist==3.8.0", "pytest-split==0.11.0", "mcp==1.28.0", "ty==0.0.51", "ruff==0.15.18"]
matrix = ["mautrix[encryption]==0.21.0", "Markdown==3.10.2", "aiosqlite==0.22.1", "asyncpg==0.31.0", "aiohttp-socks==0.11.0"]
cli = ["simple-term-menu==1.6.6"]
pty = [
  "ptyprocess==0.7.0",
]
honcho = ["honcho-ai==2.1.2"]
mcp = ["mcp==1.28.0"]
# Computer use — macOS background desktop control via cua-driver (MCP stdio).
# The cua-driver binary itself is installed via `easybci tools` post-setup
# (curl install script); this extra just pins the MCP client used to talk
# to it, which is already provided by the `mcp` extra.
computer-use = ["mcp==1.28.0"]
acp = ["agent-client-protocol==0.10.1"]
# Cross-lab federation: Ed25519 signing + git-as-transport for proven-pipeline
# subscriptions. Optional because solo users / single-lab installs don't need
# either dependency. Pinned exact per the security policy in this file.
federation = [
  "cryptography==49.0.0",
  "gitpython==3.1.50",
]
# mistral: extra REMOVED 2026-05-12 — `mistralai` PyPI project quarantined
# after malicious 2.4.6 release (Mini Shai-Hulud worm). Every version of
# `mistralai` returns 404 on PyPI right now, so any pin we'd write is
# unresolvable, which breaks `uv lock --check` in CI.
#
# To restore once PyPI un-quarantines:
#   1. Verify the new release is clean (read the changelog, check Socket
#      advisory page, confirm no malicious code review findings).
#   2. Add back: mistral = ["mistralai==<verified-version>"]
#   3. Re-enable Mistral in:
#        - tools/lazy_deps.py (LAZY_DEPS["tts.mistral"], LAZY_DEPS["stt.mistral"])
#        - easybci_cli/tools_config.py (un-hide from provider picker)
#        - easybci_cli/web_server.py (re-add to dashboard STT options)
#        - tools/transcription_tools.py / tools/tts_tool.py (drop disabled stubs)
#   4. Run `uv lock` to regenerate transitives.
#   5. Optionally re-add to [all] only after a few days of clean operation.
bedrock = ["boto3==1.43.34"]
termux = [
  # Baseline Android / Termux path for reliable fresh installs.
  "easybcidata-agent[cli]",
  "easybcidata-agent[pty]",
  "easybcidata-agent[mcp]",
  "easybcidata-agent[honcho]",
  "easybcidata-agent[acp]",
]
termux-all = [
  # Best-effort "install all" profile for Termux. Same policy as [all]:
  # only includes extras that aren't covered by `tools/lazy_deps.py`.
  # Backends like dingtalk/feishu/honcho lazy-install at
  # first use, so they're no longer eager-installed here.
  "easybcidata-agent[termux]",
  "easybcidata-agent[google]",
  "easybcidata-agent[web]",
]
dingtalk = ["dingtalk-stream==0.24.3", "alibabacloud-dingtalk==2.2.49", "qrcode==8.2"]
feishu = ["lark-oapi==1.6.8", "qrcode==8.2"]
google = [
  # Required by the google-workspace skill (Gmail, Calendar, Drive, Contacts,
  # Sheets, Docs).  Declared here so packagers (Nix, Homebrew) ship them with
  # the [all] extra and users don't hit runtime `pip install` paths that fail
  # in environments without pip (e.g. Nix-managed Python).
  "google-api-python-client==2.197.0",
  "google-auth-oauthlib==1.4.0",
  "google-auth-httplib2==0.4.0",
]
youtube = [
  # Required by skills/media/youtube-content and
  # optional-skills/productivity/memento-flashcards (youtube_quiz.py).
  # Without this declaration uv sync omits the package and both skills fail
  # at first invocation with ModuleNotFoundError.
  "youtube-transcript-api==1.2.4",
]
# `easybci dashboard` (localhost SPA + API).  Not in core to keep the default install lean.
# aiohttp is pulled in here because services/gateway/platforms/api_server.py — the HTTP/SSE
# transport the dashboard talks to on :8642 — imports `from aiohttp import web` and has no
# lazy-install fallback. Without it, the gateway starts with zero adapters and the WebUI
# permanently shows "Gateway not running".
web = ["fastapi==0.138.0", "uvicorn[standard]==0.49.0", "aiohttp==3.14.1"]
all = [
  # Policy (2026-05-12): `[all]` includes only extras that genuinely
  # CAN'T be lazy-installed via `tools/lazy_deps.py` — i.e. things every
  # session can use, things needed before the agent loop is alive
  # (terminal/CLI), and skill deps that packagers (Nix, AUR, Homebrew)
  # need in the wheel. Anything an opt-in backend (provider, search,
  # TTS, image, memory, terminal sandbox) needs
  # MUST live exclusively in `LAZY_DEPS` and resolve at first use —
  # otherwise one quarantined PyPI release breaks every fresh install.
  #
  # Removed from [all] on 2026-05-12 (covered by lazy-install):
  #   anthropic, exa, firecrawl, parallel-web, fal, edge-tts,
  #   modal, daytona, vercel,
  #   matrix, honcho, voice (faster-whisper),
  #   dingtalk, feishu, bedrock, tts-premium (elevenlabs)
  #
  # Why: the matrix extra in particular pulls `mautrix[encryption]`
  # which depends on `python-olm`. python-olm has Linux-only wheels and
  # no native build path on Windows or modern macOS. With matrix in
  # [all], `uv sync --locked` on Windows tried to build it from sdist
  # and failed on `make`. Lazy-install routes that build to first use,
  # where the user is expected to have a toolchain available.
  "easybcidata-agent[cli]",
  "easybcidata-agent[dev]",
  "easybcidata-agent[pty]",
  "easybcidata-agent[mcp]",
  "easybcidata-agent[neural]",
  "easybcidata-agent[acp]",
  "easybcidata-agent[google]",
  "easybcidata-agent[web]",
  "easybcidata-agent[youtube]",
]

[project.scripts]
easybci = "easybci_cli.main:main"
easybcidata-agent = "run_agent:main"
easybci-acp = "acp_adapter.entry:main"

[tool.setuptools]
py-modules = ["run_agent"]

[tool.setuptools.package-data]
easybci_cli = ["web_dist/**/*"]
easybci_lib = ["locales/*.yaml"]
"services.gateway" = ["assets/**/*"]

[tool.setuptools.packages.find]
include = ["easybci_agent", "easybci_agent.*", "easybci_cli", "easybci_lib", "easybci_lib.*", "services", "services.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true  # required for PLW1514 (unspecified-encoding) — preview rule

[tool.ruff.lint]
# All other lints are intentionally disabled (see comment history on this
# file) while we wrangle typechecks — but PLW1514 is too load-bearing to
# keep off.  Bare open()/read_text()/write_text() in text mode defaults to
# the system locale encoding on Windows (cp1252 on US-locale installs),
# which silently corrupts any non-ASCII file content.  We had three
# separate Windows sandbox regressions in one debug session before
# adding the explicit encoding.  This rule keeps new code honest.
#
# Import sorting (`I`) is *not* in this global `select`: a 2026-06 dry-run
# found 441 I001 violations across 148 existing files (agent/, tools/,
# gateway/, easybci_cli/, ...) and reformatting all of them at once is
# higher risk than the cleanup is worth.  Instead, `I` is enforced *only*
# on agent-generated `pipeline.py` files at export time — see
# `tools/neural_processing/export/_lint.py:ruff_fix()` which invokes
# `ruff check --fix --select I,PLW1514 <path>` per generated file.
select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
# Tests can intentionally exercise locale-encoding edge cases.
"tests/**" = ["PLW1514"]
# Skills and plugins are partially user-authored — their own conventions.
"easybci_lib/skills/**" = ["PLW1514"]
"optional-skills/**" = ["PLW1514"]
"services/plugins/**" = ["PLW1514"]
